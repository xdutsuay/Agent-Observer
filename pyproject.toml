[project]
name = "agent-memory"
version = "0.3.0"
requires-python = ">=3.10"
description = "IDE-agnostic agent memory: repo-scoped persistence, MCP tools, workspace observation"
readme = "README.md"

dependencies = [
  "fastapi>=0.95",
  "uvicorn[standard]>=0.22",
  "pydantic>=2.0",
  "watchdog>=3.0",
  "psutil>=5.9",
  "mcp>=1.0",
  "httpx>=0.27",
]

[project.optional-dependencies]
llm = ["openai>=1.0", "anthropic>=0.25"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[project.scripts]
agent-memory = "agent_memory_mcp.cli:entry"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["agent_memory_mcp*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
